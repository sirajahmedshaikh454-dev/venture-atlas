<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards — Venture Atlas</title>
<meta name="description" content="Flip-card decks for Technology Entrepreneurship lectures 7, 8 and 9.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2314120F'/%3E%3Cpath d='M16 5l3 11-3 11-3-11z' fill='%23F2B227'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="flashcards">
<main id="main">
  <header class="page-head"><div class="wrap">
    <span class="kicker">Active recall</span>
    <h1 class="display" data-split="now" style="margin-top:20px">Flip. Recall. <em>Repeat.</em></h1>
    <p class="lede">Say the answer out loud before you flip. Mark what you know — quick-revision mode then drills only the rest. Keys: space, arrows, K, U.</p>
  </div></header>
  <section class="wrap" style="padding-bottom:60px">
    <div id="fcTools" style="margin-bottom:28px"></div>
    <div class="bar" style="max-width:760px;margin:0 auto 28px"><i id="fcBar" style="background:var(--good)"></i></div>
    <div class="fc-stage" id="fcStage"></div>
    <div class="fc-stats" id="fcStats"></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/bank.js"></script>
<script src="assets/js/stories.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/flashcards.js"></script>
</body>
</html>
